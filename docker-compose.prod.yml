name: filetree-explorer

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image tag or digest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
